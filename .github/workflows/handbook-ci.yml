name: Handbook CI & Link Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every weekday at 04:00 UTC to maintain active repository health
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Chapter Integrity
        run: |
          echo "Checking handbook chapter files..."
          ls -la chapters/
          total_chapters=$(ls -1 chapters/*.md | wc -l)
          echo "Total chapters detected: $total_chapters"
          if [ "$total_chapters" -lt 15 ]; then
            echo "Error: Missing handbook chapters!"
            exit 1
          fi
          echo "All 15 modules verified successfully."

      - name: Validate README Markdown
        run: |
          test -f README.md && echo "README.md verified"
          test -f LICENSE && echo "LICENSE verified"
